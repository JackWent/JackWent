# Keeps the "tail -n 5 ~/blog/rss.xml" list in the README in step with the site.
name: blog-posts

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://jackwent.co.uk/rss.xml"
          max_post_count: 5
          template: "- `$date` [$title]($url)$newline"
          date_format: "dd mmm yy"
          commit_message: "Update latest blog posts"
